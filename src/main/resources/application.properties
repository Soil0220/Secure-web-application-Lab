spring.application.name=gov-subsidy-portal
spring.datasource.url=jdbc:mysql://localhost:3306/gov_db?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root1234!

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.admin.username=admin
app.admin.password=admin1234!
app.fileManager.uploadDir=uploads

app.encrypt.secret=mySecurityKey
app.encrypt.salt=a1b2c3d4e5f60708

# jvm jackson jpa mysql의 타임존을 UTC로 통합
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# N+1 문제 해결을 위해 1:1, N:1 관계는 join fetch를 적용하지만
# 1:N 관계는 지연로딩 발생시 묶어서(100개) 요청하도록 설정
spring.jpa.properties.hibernate.default_batch_fetch_size=100

# 업로드 파일 및 요청 크기 제한
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

#Redis 설정
spring.session.store-type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379