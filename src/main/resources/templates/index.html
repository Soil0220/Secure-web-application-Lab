<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>정부지원금 포털</title>
</head>
<body>
    <h1>정부지원금 포털 메인</h1>

    <!-- 로그인 안됨 -->
    <div th:if="${user == null}">
        <p>로그인이 필요합니다.</p>
        <a th:href="@{/user/login}">로그인</a>
        <a th:href="@{/user/join}">회원가입</a>
    </div>

    <!-- 로그인 됨 -->
    <div th:if="${user != null}">
        <p><strong th:text="${user.name}">name</strong>님 환영합니다! (아이디: <span th:text="${user.username}">username</span>)</p>
        <form th:action="@{/user/logout}" method="post">
            <button type="submit">로그아웃</button>
        </form>
    </div>
</body>
</html>
